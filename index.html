<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Energol31.github.io</title>
    <style>
        body {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            background: #646464;
        }

        .container {
            text-align: center;
            background: #4b4b4b;
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 8px 16px #1e1e1e;
            border: 5px solid #282828;
            max-width: 600px;
            width: 100%;
        }

        .przycisk {
            display: inline-block;
            padding: 20px 35px;
            margin: 15px;
            font-size: 1.2rem;
            color: #000000;
            border: 2px solid #1e1e1e;
            border-radius: 40px;
            text-decoration: none;
            transition: all 0.1s ease;
            box-shadow: 0 9px 20px #1e1e1e;
            width: 200px;
        }

        .przycisk:hover {
            background: #484848;
            border-color: #191919;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 30px #141414;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://github.com/Energol31" class="przycisk">Github</a>
        <a href="https://namemc.com/profile/Energol" class="przycisk">NameMC</a>
        <a href="https://youtu.be/dQw4w9WgXcQ?si=t47EfNa3ptgl5Q-K" class="przycisk">Youtube</a>
    </div>
</body>
</html>
